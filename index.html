<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1F4E78">
<title>Claustro 2026 – Docentes</title>
<style>
  :root {
    --azul: #1F4E78; --azul2: #2E75B6; --fondo: #f3f5f8; --tarjeta: #fff; --texto: #1d2733; --gris: #6b7684; --borde: #dde3ea;
    --si: #1e8e3e; --si-bg: #e6f4ea; --duda: #c77700; --duda-bg: #fff4e0; --no: #c5221f; --no-bg: #fde8e7; --wa: #25D366;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--fondo); color: var(--texto); font-size: 16px; }
  header { position: sticky; top: 0; z-index: 5; background: var(--azul); color: #fff; padding: 10px 14px 8px; box-shadow: 0 2px 6px rgba(0,0,0,.2); }
  header h1 { font-size: 17px; margin: 0 0 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  header h1 small { font-weight: 400; font-size: 12px; opacity: .85; }
  select, input[type=search], input[type=text], input[type=password], textarea { width: 100%; font: inherit; padding: 9px 10px; border-radius: 8px; border: 1px solid var(--borde); background: #fff; color: var(--texto); }
  .fila { display: flex; gap: 6px; margin-top: 6px; }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding: 8px 0 2px; scrollbar-width: none; }
  .chip { flex: none; border: 0; border-radius: 16px; padding: 6px 11px; font: inherit; font-size: 13px; background: rgba(255,255,255,.18); color: #fff; }
  .chip.on { background: #fff; color: var(--azul); font-weight: 600; }
  .barra { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: rgba(255,255,255,.25); margin-top: 6px; }
  .barra i { display: block; height: 100%; }
  .leyenda { font-size: 12px; margin-top: 4px; opacity: .95; }
  main { padding: 10px 10px 90px; max-width: 760px; margin: 0 auto; }
  .card { background: var(--tarjeta); border-radius: 12px; padding: 11px 12px; margin-bottom: 9px; border-left: 5px solid var(--borde); box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .card.con_nosotros { border-left-color: var(--si); }
  .card.por_convencer { border-left-color: var(--duda); }
  .card.en_contra { border-left-color: var(--no); }
  .nom { font-weight: 650; font-size: 15.5px; line-height: 1.25; }
  .meta { color: var(--gris); font-size: 12.5px; margin-top: 2px; }
  .tel { font-size: 13px; margin-top: 3px; color: var(--gris); }
  .acc { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-top: 9px; }
  .acc a, .acc button { display: flex; align-items: center; justify-content: center; gap: 5px; text-decoration: none; border: 0; border-radius: 9px; padding: 10px 4px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
  .b-wa { background: var(--wa); color: #fff; }
  .b-tel { background: var(--azul2); color: #fff; }
  .b-nota { background: #eef2f6; color: var(--texto); }
  .dis { opacity: .35; pointer-events: none; }
  .est { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 6px; }
  .card.no_contesta { border-left-color: #7b8794; }
  .est button.x.on { background: #eceff3; border-color: #7b8794; color: #4a5562; font-weight: 700; }
  .ayuda { font-size: 12px; color: var(--gris); margin-top: 4px; }
  .tabs { display: flex; margin-top: 8px; background: rgba(255,255,255,.15); border-radius: 10px; padding: 3px; gap: 3px; }
  .tabs button { flex: 1; border: 0; border-radius: 8px; padding: 7px 2px; font: inherit; font-size: 13px; background: transparent; color: #fff; cursor: pointer; white-space: nowrap; }
  .tabs button.on { background: #fff; color: var(--azul); font-weight: 700; }
  .cab { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .sx { display: flex; gap: 4px; flex: none; }
  .sx button { border: 1px solid var(--borde); background: #fff; border-radius: 8px; padding: 3px 6px; font-size: 16px; cursor: pointer; opacity: .35; }
  .sx button.on { opacity: 1; border-color: var(--azul2); background: #e8f1fb; }
  .est button { border: 1px solid var(--borde); background: #fff; border-radius: 9px; padding: 8px 2px; font: inherit; font-size: 12.5px; cursor: pointer; color: var(--texto); }
  .est button.s.on { background: var(--si-bg); border-color: var(--si); color: var(--si); font-weight: 700; }
  .est button.d.on { background: var(--duda-bg); border-color: var(--duda); color: var(--duda); font-weight: 700; }
  .est button.n.on { background: var(--no-bg); border-color: var(--no); color: var(--no); font-weight: 700; }
  .notatxt { font-size: 13px; background: #f7f9fb; border-radius: 8px; padding: 6px 8px; margin-top: 7px; white-space: pre-wrap; }
  .quien { font-size: 11px; color: var(--gris); margin-top: 5px; }
  .vacio { text-align: center; color: var(--gris); padding: 40px 10px; }
  .login { max-width: 420px; margin: 60px auto; background: #fff; padding: 26px 22px; border-radius: 14px; text-align: center; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
  .login h2 { color: var(--azul); margin-top: 0; }
  .login input { margin: 6px 0 12px; text-align: center; }
  .btn { border: 0; border-radius: 10px; padding: 12px 16px; font: inherit; font-weight: 600; background: var(--azul); color: #fff; cursor: pointer; }
  .btn.sec { background: #eef2f6; color: var(--texto); }
  .icono { background: transparent; border: 0; color: #fff; font-size: 20px; cursor: pointer; padding: 2px 6px; }
  dialog { border: 0; border-radius: 14px; width: min(94vw, 520px); padding: 18px; }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  dialog h3 { margin: 0 0 10px; color: var(--azul); }
  dialog label { font-size: 13px; color: var(--gris); display: block; margin: 10px 0 4px; }
  .acciones-dlg { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: #222; color: #fff; padding: 10px 16px; border-radius: 20px; font-size: 14px; opacity: 0; transition: opacity .3s; z-index: 20; pointer-events: none; }
  .toast.ver { opacity: .92; }
  .mas { display: block; margin: 8px auto; }
  .aviso { background: #fff4e0; color: #7a4a00; font-size: 13px; padding: 6px 10px; text-align: center; }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<dialog id="dlgNota">
  <h3 id="notaTit">Nota</h3>
  <label for="notaTxt">Nota (lo que te dijo, cuándo volver a llamar…)</label>
  <textarea id="notaTxt" rows="4" maxlength="500"></textarea>
  <div class="acciones-dlg">
    <button class="btn sec" id="notaQuitar">Quitar estado</button>
    <button class="btn sec" id="notaCancel">Cancelar</button>
    <button class="btn" id="notaOk">Guardar</button>
  </div>
</dialog>

<dialog id="dlgAjustes">
  <h3>Ajustes</h3>
  <label for="miNombre">Tu nombre (aparece cuando marcas a alguien)</label>
  <input type="text" id="miNombre" maxlength="40">
  <label for="candTxt">Nombre del candidato</label>
  <input type="text" id="candTxt" maxlength="80" placeholder="Ej.: Ing. Juan Pérez">
  <label for="msjTxt">Primer mensaje de WhatsApp</label>
  <textarea id="msjTxt" rows="5" maxlength="600"></textarea>
  <label for="msj2Txt">Mensaje para los que «No contesta»</label>
  <textarea id="msj2Txt" rows="5" maxlength="600"></textarea>
  <div class="ayuda">{nombre} = nombre del docente · {candidato} = nombre del candidato · {estimado} = «estimado» o «estimada» según sea hombre o mujer. Los mensajes y el candidato se guardan para todo el equipo.</div>
  <div class="acciones-dlg">
    <button class="btn sec" id="olvidar">Bloquear este celular</button>
    <button class="btn sec" id="ajCancel">Cancelar</button>
    <button class="btn" id="ajOk">Guardar</button>
  </div>
</dialog>

const db = getFirestore(initializeApp(cfg));

let filtro = { fac: leer("fac") || "", sexo: leer("sexo") || "", est: "", q: "" }, limite = 80;

function leer(k) { try { return localStorage.getItem(k); } catch { return null; } }
function guardarLocal(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} }
function toast(t) { const e = $("#toast"); e.textContent = t; e.classList.add("ver"); clearTimeout(e._t); e._t = setTimeout(() => e.classList.remove("ver"), 2200); }
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function sinTildes(s) { return s.normalize("NFD").replace(/[̀-ͯ]/g, "").toUpperCase(); }
function nombreBonito(n) { return n.replace(/^[.\s]+/, "").toLowerCase().replace(/(^|\s)\S/g, (c) => c.toUpperCase()); }
function celular(t) { const d = String(t || "").replace(/\D/g, ""); return /^[67]\d{7}$/.test(d) ? d : null; }
const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));

async function descifrar(clave) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(clave), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(CIFRADO.s), iterations: CIFRADO.n, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const txt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(CIFRADO.i) }, key, b64(CIFRADO.d));
  return JSON.parse(new TextDecoder().decode(txt));
}

function pantallaClave(msg) {
  raiz.innerHTML = `<div class="login"><h2>Claustro 2026</h2>
    <p>Escribe la clave del equipo.<br><small>Solo se pide una vez en este celular.</small></p>
    <input type="password" id="clave" autocomplete="current-password" placeholder="Clave">
    ${msg ? `<p style="color:var(--no)">${msg}</p>` : ""}
    <button class="btn" id="entrar">Entrar</button></div>`;
  const ir = async () => {
    const c = $("#clave").value.trim(); if (!c) return;
    $("#entrar").disabled = true; $("#entrar").textContent = "Abriendo…";
    try { docentes = await descifrar(c); guardarLocal("clave", c); iniciar(); }
    catch { pantallaClave("Clave incorrecta"); }
  };
  $("#entrar").onclick = ir;
  $("#clave").onkeydown = (e) => { if (e.key === "Enter") ir(); };
  $("#clave").focus();
}

async function arrancar() {
  // el enlace del equipo trae la clave en #k=... (no viaja al servidor ni queda en GitHub)
  const k = new URLSearchParams(location.hash.slice(1)).get("k");
  if (k) { guardarLocal("clave", k); history.replaceState(null, "", location.pathname); }
  const c = k || leer("clave");
  if (c) { try { docentes = await descifrar(c); return iniciar(); } catch { guardarLocal("clave", null); } }
  pantallaClave();
}

function iniciar() {
  raiz.innerHTML = `

    <h1><span>Claustro 2026 · Docentes <small id="yo"></small></span><button class="icono" id="btnAj" title="Ajustes">⚙️</button></h1>

    <div class="fila"><input type="search" id="buscar" placeholder="Buscar por nombre o teléfono…"></div>
    <div class="tabs" id="tabsSexo"></div>
    <div class="chips" id="chips"></div>
    <div class="barra" id="barra"></div>
    <div class="leyenda" id="leyenda"></div>
  </header>
  <div class="aviso" id="aviso" hidden></div>
  <main id="lista"></main>`;
  $("#selFac").onchange = (e) => { filtro.fac = e.target.value; guardarLocal("fac", filtro.fac); limite = 80; pintar(); scrollTo(0, 0); };
  $("#buscar").oninput = (e) => { filtro.q = sinTildes(e.target.value.trim()); limite = 80; pintar(); };
  $("#btnAj").onclick = abrirAjustes;
  $("#lista").onclick = clicLista;
  pintar();
  onSnapshot(collection(db, "seguimiento"), (snap) => {
    snap.docChanges().forEach((c) => c.type === "removed" ? seg.delete(c.doc.id) : seg.set(c.doc.id, c.doc.data()));
    avisar(""); pintar();
  }, (e) => avisar("No se puede leer Firestore: " + e.message));
  onSnapshot(doc(db, "config", "mensaje"), (d) => { cfgMsj = d.exists() ? d.data() : {}; pintar(); }, () => {});
  if (!leer("yo")) setTimeout(abrirAjustes, 400);
}

function avisar(t) { const a = $("#aviso"); if (a) { a.hidden = !t; a.textContent = t; } }
function enFac(d) { return !filtro.fac || d.facultades.includes(filtro.fac); }
function estado(d) { return seg.get(d.id)?.estado; }
// sexo: lo corregido a mano (Firestore) manda sobre lo deducido del nombre
function sexoDe(d) { return seg.get(d.id)?.sexo || d.sexo || ""; }
const SEXOS = [["", "Todos"], ["H", "👨 Hombres"], ["M", "👩 Mujeres"], ["?", "❔ Sin definir"]];

function pintar() {
  if (!$("#lista")) return;
  $("#yo").textContent = leer("yo") ? "· " + leer("yo") : "";
  const facs = new Map();
  docentes.forEach((d) => d.facultades.forEach((f) => facs.set(f, (facs.get(f) || 0) + 1)));
  const orden = [...facs.keys()].sort((a, b) => (a === "Sin facultad") - (b === "Sin facultad") || a.localeCompare(b));
  const sel = $("#selFac");
  sel.innerHTML = `<option value="">Todas las facultades (${docentes.length})</option>` + orden.map((f) => `<option value="${esc(f)}">${esc(f)} (${facs.get(f)})</option>`).join("");
  if (filtro.fac && !facs.has(filtro.fac)) filtro.fac = "";
  sel.value = filtro.fac;
  const enFacultad = docentes.filter(enFac);
  const cs = { H: 0, M: 0, "?": 0 };
  enFacultad.forEach((d) => cs[sexoDe(d) || "?"]++);
  const visibles = SEXOS.filter(([k]) => k !== "?" || cs["?"] || filtro.sexo === "?");
  $("#tabsSexo").innerHTML = visibles.map(([k, t]) => `<button class="${filtro.sexo === k ? "on" : ""}" data-sexo="${k}">${t} ${k ? cs[k] : enFacultad.length}</button>`).join("");
  $("#tabsSexo").querySelectorAll("button").forEach((b) => b.onclick = () => { filtro.sexo = b.dataset.sexo; guardarLocal("sexo", filtro.sexo); limite = 80; pintar(); });
  const base = enFacultad.filter((d) => !filtro.sexo || (sexoDe(d) || "?") === filtro.sexo);
  const cnt ={ con_nosotros: 0, por_convencer: 0, en_contra: 0, no_contesta: 0, sin: 0 };
  base.forEach((d) => cnt[ESTADOS[estado(d)] ? estado(d) : "sin"]++);
  const chips = [["", `Todos ${base.length}`], ["con_nosotros", `✅ Con nosotros ${cnt.con_nosotros}`], ["por_convencer", `🤔 Por convencer ${cnt.por_convencer}`],
    ["en_contra", `❌ No está ${cnt.en_contra}`], ["no_contesta", `📵 No contesta ${cnt.no_contesta}`], ["sin", `⚪ Sin contactar ${cnt.sin}`]];
  $("#chips").innerHTML = chips.map(([k, t]) => `<button class="chip ${filtro.est === k ? "on" : ""}" data-est="${k}">${t}</button>`).join("");
  $("#chips").querySelectorAll(".chip").forEach((b) => b.onclick = () => { filtro.est = b.dataset.est; limite = 80; pintar(); });
  const pct = (n) => base.length ? 100 * n / base.length : 0;
  $("#barra").innerHTML = `<i style="width:${pct(cnt.con_nosotros)}%;background:#5bd47c"></i><i style="width:${pct(cnt.por_convencer)}%;background:#ffb74d"></i><i style="width:${pct(cnt.en_contra)}%;background:#ff7b72"></i>`;
  $("#leyenda").textContent = `Con nosotros ${pct(cnt.con_nosotros).toFixed(0)} % · Por convencer ${pct(cnt.por_convencer).toFixed(0)} % · No está ${pct(cnt.en_contra).toFixed(0)} %`;
  let L = base.filter((d) => !filtro.est || (filtro.est === "sin" ? !ESTADOS[estado(d)] : estado(d) === filtro.est));
  if (filtro.q) L = L.filter((d) => sinTildes(d.nombre).includes(filtro.q) || (d.tel1 + " " + d.tel2).includes(filtro.q));
  if (!L.length) { $("#lista").innerHTML = `<div class="vacio">No hay docentes con ese filtro.</div>`; return; }
  $("#lista").innerHTML = L.slice(0, limite).map(tarjeta).join("") +
    (L.length > limite ? `<button class="btn sec mas" data-acc="mas">Ver más (${L.length - limite} restantes)</button>` : "");
}

function tarjeta(d) {
  const s = seg.get(d.id) || {};
  const tel = celular(d.tel1) || celular(d.tel2);
  const fijo = !tel && (d.tel1 || d.tel2);
  const otras = d.facultades.filter((f) => f !== filtro.fac);
  const meta = [filtro.fac ? (otras.length ? "También: " + otras.join(", ") : "") : d.facultades.join(" · "), d.carreras.join(", ")].filter(Boolean).join(" — ");
  const quien = s.quien || s.en ? `Marcado${s.quien ? " por " + esc(s.quien) : ""}${s.en?.toDate ? " · " + s.en.toDate().toLocaleString("es-BO", { dateStyle: "short", timeStyle: "short" }) : ""}` : "";
  const segundo = s.estado === "no_contesta";
  const sx = sexoDe(d);
  const texto = encodeURIComponent((segundo ? msj2() : msj()).replaceAll("{nombre}", nombreBonito(d.nombre))
    .replaceAll("{candidato}", cfgMsj.candidato || "______")
    .replaceAll("{estimado}", sx === "M" ? "estimada" : sx === "H" ? "estimado" : "estimado(a)"));
  return `<div class="card ${ESTADOS[s.estado] ? s.estado : ""}" data-id="${d.id}">
    <div class="cab"><div class="nom">${esc(nombreBonito(d.nombre))}</div>
      <div class="sx"><button class="${sx === "H" ? "on" : ""}" data-acc="sexo" data-v="H" title="Hombre">👨</button><button class="${sx === "M" ? "on" : ""}" data-acc="sexo" data-v="M" title="Mujer">👩</button></div></div>
    ${meta ? `<div class="meta">${esc(meta)}</div>` : ""}
    <div class="tel">${d.tel1 ? "📱 " + esc(d.tel1) : "Sin teléfono"}${d.tel2 ? " / " + esc(d.tel2) : ""}${d.prov ? " · Prov." : ""}</div>
    <div class="acc">
      <a class="b-wa ${tel ? "" : "dis"}" href="${tel ? `https://wa.me/591${tel}?text=${texto}` : "#"}" target="_blank" rel="noopener">💬 ${segundo ? "Recordar" : "WhatsApp"}</a>
      <a class="b-tel ${tel || fijo ? "" : "dis"}" href="${tel ? "tel:+591" + tel : fijo ? "tel:" + String(d.tel1 || d.tel2).replace(/\D/g, "") : "#"}">📞 Llamar</a>
      <button class="b-nota" data-acc="nota">📝 Nota</button>
    </div>
    <div class="est">${Object.entries(ESTADOS).map(([k, e]) => `<button class="${e.cls} ${s.estado === k ? "on" : ""}" data-acc="est" data-v="${k}">${e.txt}</button>`).join("")}</div>
    ${s.nota ? `<div class="notatxt">${esc(s.nota)}</div>` : ""}
    ${quien ? `<div class="quien">${quien}</div>` : ""}
  </div>`;
}

async function guardar(id, datos) {
  const yo = leer("yo");
  try { await setDoc(doc(db, "seguimiento", id), { ...datos, ...(yo ? { quien: yo } : {}), en: serverTimestamp() }, { merge: true }); }
  catch (e) { toast("No se pudo guardar: " + e.message); }
}

let notaId = null;
function clicLista(ev) {
  const b = ev.target.closest("[data-acc]"); if (!b) return;
  if (b.dataset.acc === "mas") { limite += 120; return pintar(); }
  const id = b.closest(".card").dataset.id, d = docentes.find((x) => x.id === id), s = seg.get(id) || {};
  if (b.dataset.acc === "sexo") {
    if (sexoDe(d) === b.dataset.v) return;
    guardar(id, { sexo: b.dataset.v });
    toast(b.dataset.v === "H" ? "Marcado como hombre" : "Marcada como mujer");
  } else if (b.dataset.acc === "est") {
    const v = b.dataset.v, quitar = s.estado === v;
    guardar(id, { estado: quitar ? deleteField() : v });
    toast(quitar ? "Estado quitado" : ESTADOS[v].txt);
  } else if (b.dataset.acc === "nota") {
    notaId = id; $("#notaTit").textContent = nombreBonito(d.nombre); $("#notaTxt").value = s.nota || ""; $("#dlgNota").showModal();
  }
}
$("#notaCancel").onclick = () => $("#dlgNota").close();
$("#notaOk").onclick = () => { const t = $("#notaTxt").value.trim(); guardar(notaId, { nota: t ? t : deleteField() }); $("#dlgNota").close(); toast("Nota guardada"); };
$("#notaQuitar").onclick = () => { guardar(notaId, { estado: deleteField() }); $("#dlgNota").close(); toast("Estado quitado"); };

function abrirAjustes() {
  $("#miNombre").value = leer("yo") || ""; $("#candTxt").value = cfgMsj.candidato || "";
  $("#msjTxt").value = msj(); $("#msj2Txt").value = msj2(); $("#dlgAjustes").showModal();
}
$("#ajCancel").onclick = () => $("#dlgAjustes").close();
$("#ajOk").onclick = async () => {
  guardarLocal("yo", $("#miNombre").value.trim() || null);
  const nuevo = { candidato: $("#candTxt").value.trim(), texto: $("#msjTxt").value.trim() || MSJ_DEF, texto2: $("#msj2Txt").value.trim() || MSJ2_DEF };
  if (nuevo.candidato !== (cfgMsj.candidato || "") || nuevo.texto !== msj() || nuevo.texto2 !== msj2()) {
    try { await setDoc(doc(db, "config", "mensaje"), nuevo); toast("Guardado para todo el equipo"); } catch (e) { toast("No se pudo guardar: " + e.message); }
  }
  $("#dlgAjustes").close(); pintar();
};
$("#olvidar").onclick = () => { guardarLocal("clave", null); location.reload(); };

arrancar();
</script>
</body>
</html>
